name: Update participants

# Applies an "Add or remove a participant" issue to data/members.json, then closes the issue.
# Only issues opened by the repository owner are applied.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write   # to start the site deploy right away

jobs:
  apply:
    if: contains(github.event.issue.labels.*.name, 'participant') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Apply the request
        id: apply
        env:
          RESULT_FILE: ${{ runner.temp }}/result.txt
        run: python3 tools/members_from_issue.py

      - name: Check and commit
        run: |
          python3 tools/check_data.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/members.json feeds
          git diff --cached --quiet || { git commit -m "Participants: issue #${{ github.event.issue.number }}"; git pull --rebase -q origin main; git push -q origin HEAD:main; }

      - name: Report and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          RESULT_FILE: ${{ runner.temp }}/result.txt
        run: |
          MSG=$(cat "$RESULT_FILE" 2>/dev/null || echo "Something went wrong; see the Actions log.")
          gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "$MSG The site updates in a couple of minutes."
          gh issue close "$NUM" -R "$GITHUB_REPOSITORY"
          gh workflow run pages.yml -R "$GITHUB_REPOSITORY" || true
