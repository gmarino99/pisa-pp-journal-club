name: Fetch arXiv feed

# Saves the day's new arXiv papers to feeds/arxiv.json at 06:10 Rome time, before the 06:50 digest routine reads them.
on:
  schedule:
    # 06:10 Rome time. GitHub cron is UTC: 05:10 UTC in winter (CET), 04:10 UTC in summer (CEST).
    # Both are scheduled; the first step keeps only the one that is 06:10 in Rome today
    # (it checks which schedule fired, so GitHub's start-up delays do not matter).
    - cron: "10 4 * * 1-5"
    - cron: "10 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Keep only the 06:10 Rome schedule
        id: gate
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(TZ=Europe/Rome date +%z)" = "+0200" ]; then WANT="10 4 * * 1-5"; else WANT="10 5 * * 1-5"; fi
            if [ "$FIRED" != "$WANT" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Not the 06:10 Rome schedule today, skipping."; fi
          fi

      - name: Download new announcements
        if: steps.gate.outputs.skip != 'true'
        run: python3 tools/fetch_arxiv.py

      - name: Commit the feed
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ -n "$(git status --porcelain -- feeds)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feeds
            git commit -m "arXiv feed $(date -u +%F)"
            git pull --rebase -q origin main
            git push -q origin HEAD:main
          else
            echo "No change in the feed."
          fi
