name: Fetch arXiv feed

# Saves the day's new arXiv papers to feeds/arxiv.json before the 08:00 digest routine reads them.
on:
  schedule:
    - cron: "15 5 * * 1-5"   # 06:15 Rome in winter, 07:15 in summer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download new announcements
        run: python3 tools/fetch_arxiv.py

      - name: Commit the feed
        run: |
          if [ -n "$(git status --porcelain -- feeds)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feeds
            git commit -m "arXiv feed $(date -u +%F)"
            git pull --rebase -q origin main
            git push -q origin HEAD:main
          else
            echo "No change in the feed."
          fi
