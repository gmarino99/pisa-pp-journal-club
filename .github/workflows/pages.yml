name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # refresh vote counts every 3 hours
  workflow_dispatch:

permissions:
  contents: write      # commit data/votes.json when counts change
  discussions: write   # read 👍/👎 reactions and create a discussion for each new paper
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refresh votes and interest posts from GitHub Discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/fetch_votes.py
          if [ -n "$(git status --porcelain -- data/votes.json feeds/github.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/votes.json feeds/github.json
            git commit -m "Update votes and interests from GitHub"
            git pull --rebase -q origin main && git push -q origin HEAD:main || echo "Push of vote counts failed; the site still deploys with them."
          fi

      - name: Check data files
        run: python3 tools/check_data.py

      - name: Assemble site
        # Publish only what the browser needs (no tools/, README, workflow).
        run: |
          mkdir _site
          cp -r index.html jc.html assets data _site/
          # Cache-busting: each deploy gets new asset URLs, so browsers never mix old JS with new HTML.
          sed -i -E "s/\?v=[0-9a-z]+\"/?v=${GITHUB_SHA::8}\"/g" _site/index.html _site/jc.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      # GitHub sometimes reports "No artifacts named github-pages were found" right after a successful upload
      # (seen on 25 Nov 2026 for every push-triggered run). Try once more after a short wait before failing.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
